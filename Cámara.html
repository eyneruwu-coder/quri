<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor HTML</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; transition: background 0.3s; }

        /* === VARIABLES DE TEMA === */
        :root {
            --bg-app: #121212;
            --bg-barra: #1e1e2e;
            --bg-nav: #1a1a2e;
            --bg-btn: #2d2d44;
            --bg-acento: #2563eb;
            --texto: #ffffff;
            --borde: #333;
            --bg-editor: #1e1e1e;
            --texto-editor: #f8f8f2;
            --bg-vista: #ffffff;
        }
        .tema-claro {
            --bg-app: #f5f5f5;
            --bg-barra: #ffffff;
            --bg-nav: #eeeeee;
            --bg-btn: #dddddd;
            --bg-acento: #2563eb;
            --texto: #000000;
            --borde: #ccc;
            --bg-editor: #ffffff;
            --texto-editor: #222222;
            --bg-vista: #ffffff;
        }
        body { background: var(--bg-app); color: var(--texto); }

        /* === BARRA SUPERIOR === */
        .barra-superior {
            height: 60px;
            background: var(--bg-barra);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid var(--borde);
            z-index: 10;
        }
        .btn-tema {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-btn);
            color: var(--texto);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .logo {
            background: var(--bg-acento);
            color: white;
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        /* === BARRA DE HERRAMIENTAS — ✅ MÁS ALTURA PARA QUE QUEDE TODO EN MÓVIL === */
        .barra-herramientas {
            min-height: 56px; /* Más altura para que las flechas no se corten */
            background: var(--bg-nav);
            display: none;
            align-items: center;
            padding: 8px 10px;
            gap: 6px;
            border-bottom: 1px solid var(--borde);
            flex-wrap: wrap; /* Si no cabe, se acomoda hacia abajo */
            z-index: 5;
        }
        .barra-herramientas.visible { display: flex; }
        .btn-herramienta {
            background: var(--bg-btn);
            color: var(--texto);
            border: none;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-herramienta:hover { background: var(--bg-acento); color: white; }

        /* === BUSCADOR CON FLECHAS — TODO VISIBLE, TAMAÑO AJUSTADO === */
        .buscador-contenedor {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .buscar-input {
            padding: 6px 8px;
            border: 1px solid var(--borde);
            border-radius: 4px;
            background: var(--bg-editor);
            color: var(--texto);
            outline: none;
            width: 120px; /* Más angosto para dejar espacio a flechas */
            font-size: 14px;
        }
        .btn-navegar {
            background: var(--bg-btn);
            color: var(--texto);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-navegar:hover { background: var(--bg-acento); color: white; }
        .contador-coincidencias {
            font-size: 11px;
            color: #888;
            min-width: 55px;
            text-align: center;
            white-space: nowrap;
        }

        /* === BARRA DE NAVEGACIÓN — ✅ SE MUEVE MÁS ABAJO PARA DEJAR ESPACIO A FLECHAS === */
        .navegacion {
            height: 52px;
            background: var(--bg-nav);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid var(--borde);
            position: relative;
            z-index: 3;
            margin-top: 0; /* Queda justo debajo de la barra de herramientas */
        }
        .btn-nav {
            flex: 1;
            height: 100%;
            background: var(--bg-btn);
            color: var(--texto);
            border: none;
            font-size: 13px;
            cursor: pointer;
            padding: 0 2px;
        }
        .btn-nav.activo { background: var(--bg-acento); color: white; }
        .btn-nav:first-child { border-right: 1px solid var(--borde); }
        .btn-nav:last-child { border-left: 1px solid var(--borde); }

        /* === ÁREA DE CONTENIDO — ALTURA AJUSTADA AUTOMÁTICAMENTE === */
        .contenedor {
            position: relative;
            background: var(--bg-vista);
            width: 100%;
            height: calc(100vh - 112px); /* Altura cuando NO hay barra de herramientas */
        }
        /* Cuando la barra de herramientas está visible, se resta su altura */
        .barra-herramientas.visible + .navegacion + .contenedor,
        .contenedor.ajustado {
            height: calc(100vh - 168px); /* ✅ Espacio extra para la barra más alta */
        }
        #editor, #vistaWeb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }
        #editor {
            background: var(--bg-editor);
            color: var(--texto-editor);
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            outline: none;
            z-index: 2;
        }
        #vistaWeb {
            background: white;
            z-index: 1;
        }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <header class="barra-superior">
        <button class="btn-tema" id="btnTema">🌙</button>
        <div class="logo">Visor HTML</div>
    </header>

    <!-- 🛠️ BARRA DE HERRAMIENTAS — MÁS ALTA, FLECHAS SIEMPRE VISIBLES -->
    <nav class="barra-herramientas" id="barraHerramientas">
        <button class="btn-herramienta" id="btnDeshacer">↶ Deshacer</button>
        <button class="btn-herramienta" id="btnRehacer">↷ Rehacer</button>
        <button class="btn-herramienta" id="btnGuardar">💾 Guardar</button>
        
        <!-- 🔍 BUSCADOR + FLECHAS — TODO VISIBLE EN MÓVIL -->
        <div class="buscador-contenedor">
            <input type="text" class="buscar-input" id="buscarInput" placeholder="Buscar...">
            <span class="contador-coincidencias" id="contadorCoincidencias"></span>
            <button class="btn-navegar" id="btnArriba" title="Anterior">⬆️</button>
            <button class="btn-navegar" id="btnAbajo" title="Siguiente">⬇️</button>
        </div>
    </nav>

    <!-- 📂 BARRA DE NAVEGACIÓN — QUEDA MÁS ABAJO, SIN TAPAR NADA -->
    <nav class="navegacion">
        <button class="btn-nav" id="btnAbrir">📂 Abrir</button>
        <button class="btn-nav activo" id="btnCodigo">📝 Código</button>
        <button class="btn-nav" id="btnVista">🌐 Vista</button>
    </nav>

    <main class="contenedor" id="contenedor">
        <textarea id="editor" placeholder="Escribe tu código HTML aquí..."></textarea>
        <iframe id="vistaWeb" title="Vista previa"></iframe>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const vistaWeb = document.getElementById('vistaWeb');
        const btnAbrir = document.getElementById('btnAbrir');
        const btnCodigo = document.getElementById('btnCodigo');
        const btnVista = document.getElementById('btnVista');
        const btnTema = document.getElementById('btnTema');
        const barraHerramientas = document.getElementById('barraHerramientas');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnDeshacer = document.getElementById('btnDeshacer');
        const btnRehacer = document.getElementById('btnRehacer');
        const buscarInput = document.getElementById('buscarInput');
        const contadorCoincidencias = document.getElementById('contadorCoincidencias');
        const btnArriba = document.getElementById('btnArriba');
        const btnAbajo = document.getElementById('btnAbajo');
        const contenedor = document.getElementById('contenedor');

        // === 🎨 TEMA ===
        let temaOscuro = true;
        btnTema.addEventListener('click', () => {
            temaOscuro = !temaOscuro;
            document.body.classList.toggle('tema-claro', !temaOscuro);
            btnTema.textContent = temaOscuro ? '🌙' : '☀️';
        });

        // === 📂 ABRIR ===
        btnAbrir.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.html,.htm';
            input.onchange = e => {
                const archivo = e.target.files[0];
                if (!archivo) return;
                const lector = new FileReader();
                lector.onload = evt => {
                    editor.value = evt.target.result;
                    mostrarCodigo();
                };
                lector.readAsText(archivo);
            };
            input.click();
        });

        // === 📝 MOSTRAR CÓDIGO — ✅ MUESTRA BARRA Y AJUSTA ESPACIO ===
        function mostrarCodigo() {
            btnCodigo.classList.add('activo');
            btnVista.classList.remove('activo');
            editor.classList.remove('oculto');
            vistaWeb.classList.add('oculto');
            barraHerramientas.classList.add('visible');
            contenedor.classList.add('ajustado'); // ✅ Baja el contenido para dejar espacio a flechas
        }

        // === 🌐 MOSTRAR VISTA — ✅ OCULTA BARRA Y RECUPERA ESPACIO ===
        function mostrarVista() {
            btnVista.classList.add('activo');
            btnCodigo.classList.remove('activo');
            vistaWeb.srcdoc = editor.value;
            editor.classList.add('oculto');
            vistaWeb.classList.remove('oculto');
            barraHerramientas.classList.remove('visible');
            contenedor.classList.remove('ajustado'); // ✅ Recupera el espacio completo
        }

        btnCodigo.addEventListener('click', mostrarCodigo);
        btnVista.addEventListener('click', mostrarVista);

        // === 💾 GUARDAR CON NOMBRE ===
        btnGuardar.addEventListener('click', () => {
            const nombreArchivo = prompt('Nombre del archivo:', 'archivo.html');
            if (!nombreArchivo) return;
            const nombreFinal = nombreArchivo.endsWith('.html') ? nombreArchivo : nombreArchivo + '.html';
            const blob = new Blob([editor.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombreFinal;
            a.click();
            URL.revokeObjectURL(url);
        });

        // === ↩️ DESHACER / REHACER ===
        const historial = [];
        let posicion = -1;
        let ultimoValor = '';
        function guardarHistorial() {
            if (editor.value === ultimoValor) return;
            historial.splice(posicion + 1);
            historial.push(editor.value);
            posicion = historial.length - 1;
            ultimoValor = editor.value;
        }
        editor.addEventListener('input', guardarHistorial);
        historial.push(editor.value);
        btnDeshacer.addEventListener('click', () => {
            if (posicion > 0) {
                posicion--;
                editor.value = historial[posicion];
                ultimoValor = editor.value;
            }
        });
        btnRehacer.addEventListener('click', () => {
            if (posicion < historial.length - 1) {
                posicion++;
                editor.value = historial[posicion];
                ultimoValor = editor.value;
            }
        });

        // === 🔍 BUSCADOR CON FLECHAS ===
        let indiceActual = -1;
        let coincidencias = [];

        buscarInput.addEventListener('input', () => {
            const texto = buscarInput.value;
            coincidencias = [];
            indiceActual = -1;
            
            if (!texto) {
                contadorCoincidencias.textContent = '';
                editor.selectionStart = editor.selectionEnd = 0;
                return;
            }

            const contenido = editor.value;
            let pos = 0;
            while ((pos = contenido.indexOf(texto, pos)) !== -1) {
                coincidencias.push({ start: pos, end: pos + texto.length });
                pos += texto.length;
            }

            contadorCoincidencias.textContent = coincidencias.length > 0 
                ? `${indiceActual + 1}/${coincidencias.length}` 
                : 'Sin resultados';
        });

        btnAbajo.addEventListener('click', () => {
            if (coincidencias.length === 0) return;
            indiceActual = (indiceActual + 1) % coincidencias.length;
            seleccionarCoincidencia();
        });

        btnArriba.addEventListener('click', () => {
            if (coincidencias.length === 0) return;
            indiceActual = indiceActual <= 0 ? coincidencias.length - 1 : indiceActual - 1;
            seleccionarCoincidencia();
        });

        function seleccionarCoincidencia() {
            const sel = coincidencias[indiceActual];
            editor.focus();
            editor.selectionStart = sel.start;
            editor.selectionEnd = sel.end;
            const lineHeight = 24;
            const linea = editor.value.substring(0, sel.start).split('\n').length - 1;
            editor.scrollTop = linea * lineHeight - editor.clientHeight / 2 + 50;
            contadorCoincidencias.textContent = `${indiceActual + 1}/${coincidencias.length}`;
        }
    </script>

</body>
</html>
